name: Release natGuessr daily edition

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: natguessr-daily
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Select today’s private Toronto release
        id: release-date
        run: node -e 'const date = require("./games/natureguessr/logic.js").today(); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "secret=NATGUESSR_DAY_" + date.replaceAll("-", "_") + "\n")'
      - name: Prepare today's Toronto edition
        id: edition
        run: node games/natureguessr/_curator/scripts/publish-curation.js --scheduled
        env:
          NATGUESSR_RELEASE: ${{ secrets[steps.release-date.outputs.secret] }}
      - name: Commit public edition
        if: steps.edition.outputs.ready == 'true'
        run: |
          edition=games/natureguessr/daily
          if git diff --quiet -- "$edition/index.html" "$edition/edition.js"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$edition/index.html" "$edition/edition.js"
          git commit -m 'Release natGuessr daily edition'
          git push origin HEAD:main
      - name: Request GitHub Pages rebuild when needed
        if: steps.edition.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployed=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq 'select(.status != "errored") | .commit')
          if [ "$deployed" != "$(git rev-parse HEAD)" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
